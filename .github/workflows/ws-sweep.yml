# Workstead sweep (Slurm's controller loop): expires leases whose heartbeat
# or time limit ran out, repairs labels, retries merges waiting on checks,
# completes parents whose children are done, and publishes the board (the
# pinned issue and queue.json on the ws-board branch). See docs/concepts.md.
name: Workstead sweep

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ws-sweep
  cancel-in-progress: false

jobs:
  workstead-sweep:
    permissions:
      contents: write        # the ws-board branch
      issues: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ws
          persist-credentials: false
      - id: app
        if: vars.WS_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.WS_APP_ID }}
          private-key: ${{ secrets.WS_APP_PRIVATE_KEY }}
      - run: python3 tools/ws/ws.py actions sweep
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          WS_BOT_LOGIN: ${{ vars.WS_BOT_LOGIN }}
          # relay mode: the gate key publishes ready task issues to the relays (bridge.py)
          WS_NOSTR_KEY: ${{ secrets.WS_NOSTR_KEY }}
