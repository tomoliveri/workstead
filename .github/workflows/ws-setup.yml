# Workstead setup: runs once when a repository is created from the template
# (and again whenever workstead.json changes). Creates the labels and the
# pinned board, and writes this repository's own join prompt into README.md.
# Safe to re-run: every step is idempotent.
name: Workstead setup

on:
  push:
    branches: [main, master]
    paths: ["workstead.json", ".github/workflows/ws-setup.yml", "README.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ws-setup
  cancel-in-progress: false

jobs:
  workstead-setup:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/ws/ws.py actions setup
        env:
          GH_TOKEN: ${{ github.token }}
          WS_BOT_LOGIN: ${{ vars.WS_BOT_LOGIN }}
      - name: Commit the join prompt and CODEOWNERS
        run: |
          git add README.md .github/CODEOWNERS 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: set this repository's join prompt and code owners"
          git push
