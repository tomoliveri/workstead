# Release: push a tag like v1.2.0 to test it and publish a GitHub release
# with notes generated from the merged pull requests.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test
        run: python -m unittest discover -s tools/ws/tests -t tools/ws/tests
      - name: Check the version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python -c "import sys; sys.path.insert(0, 'tools/ws'); import workstead; print(workstead.__version__)")
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match workstead.__version__ ($have)"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Workstead $GITHUB_REF_NAME"
