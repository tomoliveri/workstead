# Workstead queue: applies fleet commands, links pull requests to tasks,
# merges approved work and keeps labels in step. See docs/protocol.md.
#
# Safety: this runs with write access on pull_request_target and on comments
# from anyone, so it never checks out or runs pull request code. It checks
# out only tools/ws and workstead.json from the default branch, and it never
# evaluates comment text (commands are parsed with strict patterns).
#
# Concurrency: one run per issue or pull request number at a time. If GitHub
# drops a queued run, the next run still processes every unprocessed comment
# (the comment log is the source of truth), so no command is lost.
name: Workstead queue

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue or pull request number
        required: true
      reason:
        description: Why (refresh, expire, merged:N, ...)
        required: false
        default: refresh
      kind:
        description: task or pr (optional)
        required: false
        default: ""

permissions:
  contents: write        # merge approved pull requests
  issues: write          # labels, assignees, status comments, new tasks
  pull-requests: write
  actions: write         # workflow_dispatch for cross-issue effects
  checks: read
  statuses: read

concurrency:
  group: ws-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue || github.run_id }}
  cancel-in-progress: false

jobs:
  workstead-queue:
    # Skip runs that can't matter, so a large fleet doesn't burn runner time:
    # only comments that start with a command, only issues that are ours.
    if: >-
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/') &&
       github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, 'ws:meta') ||
       contains(join(github.event.issue.labels.*.name, ' '), 'ws:'))) ||
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools/ws
          persist-credentials: false
      # Optional: a GitHub App token raises the API budget from 1,000 to
      # 5,000+ requests an hour (docs/scaling.md). Unset vars = GITHUB_TOKEN.
      - id: app
        if: vars.WS_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WS_APP_ID }}
          private-key: ${{ secrets.WS_APP_PRIVATE_KEY }}
      - run: python3 tools/ws/ws.py actions event
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          WS_BOT_LOGIN: ${{ vars.WS_BOT_LOGIN }}
